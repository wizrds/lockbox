name: release

on:
  push:
    tags: ["*"]

env:
  IMAGE_REGISTRY: "ghcr.io"
  IMAGE_NAME: "wizrds/lockbox"
  IMAGE_URI: "ghcr.io/wizrds/lockbox"

jobs:
  generate-sbom:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'wizrds/lockbox'
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.43.3"

      - name: Generate SBOM SPDX
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom/sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Generate SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom/sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  build-docker:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'wizrds/lockbox'
    needs: [generate-sbom]
    name: Build and push docker image.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.43.3

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image
        run: |
          task docker:build IMAGE_NAME=${{ env.IMAGE_URI }} IMAGE_TAG=${{ github.ref_name }}
          
      - name: Generate OCI Image SBOM SPDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_URI }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom/sbom.oci.spdx.json
          artifact-name: sbom.oci.spdx.json

      - name: Generate OCI Image SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_URI }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom/sbom.oci.cyclonedx.json 
          artifact-name: sbom.oci.cyclonedx.json       

      - name: Scan OCI image
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: ${{ env.IMAGE_URI }}:${{ github.ref_name }}
          fail-build: true
          severity-cutoff: critical

      - name: Upload OCI SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-oci
          path: sbom/sbom.oci.*.json

      - name: Inspect SARIF report
        if: always()
        run: |
          cat ${{ steps.scan.outputs.sarif }}

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Push OCI image
        run: |
          docker push ${{ env.IMAGE_URI }}:${{ github.ref_name }}

  make-release:
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      github.repository == 'wizrds/lockbox'
    needs: [generate-sbom, build-docker]
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.43.3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG=$(task version:current)
          PREV_VERSION=$(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n 2 | tail -n 1 | sed -E 's/^## \[([^]]+)\].*/\1/')
          
          awk -v tag="$TAG" '
            # Start when we hit the current version header
            $0 ~ "^## \\[" tag "\\]" { printing=1; next }

            # Stop when we hit the next version header
            printing && $0 ~ "^## \\[" { exit }

            printing
          ' CHANGELOG.md > release_notes.md
          
          echo "Release notes for $TAG:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/sbom.*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}