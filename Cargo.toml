[workspace.package]
version = "0.1.1"
edition = "2024"
description = "API key authentication service for Rest APIs"
repository = "https://github.com/wizrds/lockbox"
license = "ISC"
readme = "README.md"

[workspace]
resolver = "2"
members = [
    "lockbox-macros",
    "lockbox-migrations",
    "lockbox-core",
    "lockbox-api",
    "lockbox",
]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
serde_yml = { version = "0.0.12" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17" }
async-trait = { version = "0.1.89" }
futures = { version = "0.3.31" }
thiserror = { version = "2.0.16" }
anyhow = { version = "1.0.100" }
validator = { version = "0.20.0", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
log = { version = "0.4.28" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "chrono"] }
tracing-opentelemetry = { version = "0.32.0" }
opentelemetry = { version = "0.31.0" }
opentelemetry-otlp = { version = "0.31.0" }
rustls = { version = "0.23.35", features = ["aws_lc_rs"] }
axum = { version = "0.8.7", features = ["tracing"] }
axum-server = { version = "0.7.3", features = ["tls-rustls"] }
sea-orm = { version = "1.1.19", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "mock", "with-json", "with-uuid", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = "1.1.19"
uuid = { version = "1.18.1", features = ["v4", "fast-rng", "zerocopy", "serde"] }
jobq = { git = "https://github.com/wizrds/jobq-rs.git", tag = "0.1.0", version = "0.1.0" }