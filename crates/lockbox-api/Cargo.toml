[package]
name = "lockbox-api"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
lockbox-macros = { path = "../lockbox-macros" }
lockbox-core = { path = "../lockbox-core" }

serde = { workspace = true }
serde_json = { workspace = true }

uuid = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

chrono = { workspace = true }

tracing = { workspace = true }

validator = { workspace = true }

rustls = { workspace = true }

jobq = { workspace = true }

axum = { workspace = true }
axum-server = { workspace = true }

serde_qs = { version = "1.1", features = ["axum"] }
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = { version = "0.2" }
utoipa-scalar = { version = "0.3", features = ["axum"] }
tower-http = { version = "0.7", features = ["trace"] }
tower-layer = { version = "0.3" }
http = { version = "1.3" }
tower = { version = "0.5", features = ["tokio", "tracing"] }
