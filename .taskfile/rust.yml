version: '3'

tasks:
  lock:
    cmds: 
      - cargo update

  fmt:
    desc: Format the code
    cmds:
      - >
        cargo fmt --all -- --check

  fmt:fix:
    desc: Format the code
    cmds:
      - >
        cargo fmt --all

  lint:
    desc: Lint the code
    cmds:
      - >
        cargo clippy --workspace --all-targets --all-features --exclude runtime-scaf {{.CLI_ARGS}}

  lint:fix:
    desc: Lint the code
    cmds:
      - >
        cargo clippy --workspace --fix --all-targets --all-features --allow-dirty --allow-staged --exclude runtime-scaf {{.CLI_ARGS}}

  test:
    cmds:
      - cargo test --all-features --workspace --lib {{.CLI_ARGS}}

  bench:
    cmds:
      - cargo bench --all-features {{.CLI_ARGS}}

  bench:criterion:
    cmds:
      - cargo criterion --all-features {{.CLI_ARGS}}

  build:
    desc: Build the application
    cmds:
      - cargo build --all-features {{.CLI_ARGS}}
